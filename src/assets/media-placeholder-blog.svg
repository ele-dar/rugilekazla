  shared so a gallery of mixed cards still reads as one grid, and only the motif differs.
  An open journal, distinct in silhouette from the single sheet used for articles she did
  not write. Drawn in the site's greens (the green-200 / 500 / 700 / 800 tokens from
  global.css). 4:3, the aspect ratio the cards crop photos to.
-->
