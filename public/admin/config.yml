backend:
  name: git-gateway
  branch: main

# Lets you run the CMS locally against the filesystem before Netlify
# Identity/Git Gateway is configured. Run `npx decap-server` alongside
# `astro dev` and open http://localhost:4321/admin/index.html
local_backend: true

# What the Media tab lists. Every collection uploads here too (each sets its own
# media_folder/public_folder so image paths resolve relative to the entry file), so
# this only needs to point at the same folder for the tab to show those images.
media_folder: "src/assets/uploads"

# Each entry is stored once per language, in a folder named after the locale:
# src/content/experience/lt/<slug>.md and src/content/experience/en/<slug>.md.
# The editor shows both languages side by side and saves them together.
i18n:
  structure: multiple_folders
  locales: [lt, en]
  default_locale: lt

collections:
  - name: "experience"
    label: "Experience"
    folder: "src/content/experience"
    media_folder: "/src/assets/uploads"
    public_folder: "../../../assets/uploads"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    i18n: true
    sortable_fields:
      - field: title
        label: "Title"
    view_groups:
      - label: "Type:"
        field: type
    fields:
      - label: "Type"
        name: "type"
        widget: "select"
        i18n: duplicate
        options:
          - { label: "Education", value: "education" }
          - { label: "Work", value: "work" }
          - { label: "Training", value: "training" }
          - { label: "Membership", value: "membership" }
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: duplicate
        hint: "Only for entry naming. Will not be visible in the website."
      - label: "Start year"
        name: "startDate"
        widget: "string"
        i18n: duplicate
        required: false
        pattern: ['^\d{4}$', "Four digits, e.g. 2014"]
        hint: "Four-digit year. Leave blank for entries that carry no date at all (e.g. memberships), then leave the end year blank too"
      - label: "End year"
        name: "endDate"
        widget: "string"
        i18n: duplicate
        required: false
        pattern: ['^\d{4}$', "Four digits, e.g. 2016"]
        hint: "Leave blank while this is still ongoing -- the site shows 'dabar' / 'present'. For a one-year entry, repeat the start year"
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        required: false

  - name: "psychotherapy"
    label: "Psychotherapy"
    folder: "src/content/psychotherapy"
    # Uploads live in src/ rather than public/ so that Astro optimises them
    media_folder: "/src/assets/uploads"
    public_folder: "../../../assets/uploads"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    i18n: true
    sortable_fields:
      - field: order
        label: "Order"
        default_sort: "asc"
      - field: title
        label: "Title"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Order"
        name: "order"
        widget: "number"
        value_type: "int"
        min: 1
        i18n: duplicate
        hint: "Position on the Psychotherapy page, lowest first."
      - label: "Intro"
        name: "intro"
        widget: "markdown"
        i18n: true
        # A short lead-in, so the editor is the compact one and the toolbar drops
        # headings, quotes and code -- those belong in the body below.
        minimal: true
        buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
        editor_components: []
        hint: "Short intro displayed above the body."
      - label: "Featured image"
        name: "featuredImage"
        widget: "image"
        i18n: duplicate
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
      - label: "Links"
        name: "links"
        widget: "list"
        required: false
        i18n: true
        label_singular: "Link"
        summary: "{{fields.text}}"
        hint: "Shown at the bottom of the page, in this order. Internal links start with a slash, e.g. /lt/psichoterapija/tevu-konsultacijos/ -- external ones with https://. Translated, so add them in both languages"
        fields:
          - label: "Text"
            name: "text"
            widget: "string"
          - label: "URL"
            name: "url"
            widget: "string"
            pattern:
              [
                "^(https?://|/|mailto:|tel:)",
                "Start with https://, /, mailto: or tel:",
              ]

  - name: "media"
    label: "Media"
    folder: "src/content/media"
    # Uploads live in src/ rather than public/ so that Astro optimises them
    media_folder: "/src/assets/uploads"
    public_folder: "../../../assets/uploads"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    i18n: true
    sortable_fields:
      - field: publishDate
        label: "Publish date"
        default_sort: "desc"
      - field: title
        label: "Title"
    view_groups:
      - label: "Type:"
        field: type
    fields:
      - label: "Type"
        name: "type"
        widget: "select"
        i18n: duplicate
        options:
          - { label: "Article", value: "article" }
          - { label: "Video", value: "video" }
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Source"
        name: "source"
        widget: "string"
        i18n: true
        required: false
      - label: "Publish date"
        name: "publishDate"
        widget: "datetime"
        time_format: false
        date_format: "YYYY-MM-DD"
        format: "YYYY-MM-DD"
        i18n: duplicate
        hint: "The gallery lists entries newest first"
      - label: "Link"
        name: "link"
        widget: "string"
        i18n: duplicate
        pattern: ["^https?://", "Start with https://"]
      - label: "Featured image"
        name: "featuredImage"
        widget: "image"
        i18n: duplicate
        required: false
        hint: "If not provided, the card shows a placeholder for its type (a page or a screen)."

  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    # Uploads live in src/ rather than public/ so that Astro optimises them
    media_folder: "/src/assets/uploads"
    public_folder: "../../../assets/uploads"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Description"
        name: "description"
        widget: "text"
        i18n: true
        hint: "Not shown on the site. Used as the page's meta description (the grey summary Google shows under the link, and the preview text when the post is shared). One or two plain sentences, up to about 150 characters"
      - label: "Publish Date"
        name: "publishDate"
        widget: "datetime"
        i18n: duplicate
      - label: "Featured image"
        name: "featuredImage"
        widget: "image"
        i18n: duplicate
        required: false
        hint: "Shown as the banner across the top of the post, and on its card on the Articles and Videos page. Without one the post has no banner and the card shows a placeholder image."
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true

  # The next two are pages rather than lists of things: exactly one entry each, whose title
  # is the page heading and whose body is the page. The site reads each at a fixed path, so
  # adding or deleting entries here is turned off -- a second one would never appear on the
  # site and a deleted one breaks the build. Everything else matches the collections above.
  - name: "creative-work"
    label: "Creative Work page"
    label_singular: "Creative Work page"
    folder: "src/content/creative-work"
    # Uploads live in src/ rather than public/ so that Astro optimises them
    media_folder: "/src/assets/uploads"
    public_folder: "../../../assets/uploads"
    create: false
    delete: false
    slug: "{{slug}}"
    format: "frontmatter"
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
        hint: "The heading at the top of the page, and the page's name in the browser tab"
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true

  - name: "trainings"
    label: "Trainings page"
    label_singular: "Trainings page"
    folder: "src/content/trainings"
    media_folder: "/src/assets/uploads"
    public_folder: "../../../assets/uploads"
    create: false
    delete: false
    slug: "{{slug}}"
    format: "frontmatter"
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
        hint: "The heading at the top of the page, and the page's name in the browser tab"
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
